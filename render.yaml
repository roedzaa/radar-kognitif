services:
  - type: web
    name: radar-kognitif
    runtime: docker
    plan: free
    region: singapore
    autoDeploy: true
    healthCheckPath: /login
    envVars:
      - key: APP_NAME
        value: RADAR KOGNITIF
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: MAIL_MAILER
        value: log
